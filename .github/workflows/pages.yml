name: Deploy browser game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "browser-game.css"
      - "browser-game.js"
      - "assets/Images/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        run: |
          mkdir site
          cp index.html browser-game.css browser-game.js site/
          mkdir -p site/assets
          cp -R assets/Images site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
